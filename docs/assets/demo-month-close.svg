<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>1c-odata-mcp — проверка закрытия месяца</title>
  <desc>На просьбу «проверь август перед отчётностью» Claude вызывает check_month_close и get_account_card, находит остаток на счёте 26 после закрытия и расчётный счёт в минусе и говорит, что исправить</desc>

  <rect x="0" y="0" width="760" height="500" rx="16" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>

  <circle cx="52" cy="50" r="16" fill="#FAECE7"/>
  <text x="52" y="57" font-size="20" font-weight="500" fill="#993C1D" text-anchor="middle">*</text>
  <text x="80" y="46" font-size="15" font-weight="500" fill="#2C2C2A">Claude</text>
  <text x="80" y="64" font-size="12" fill="#888780">1c-odata-mcp · подключено к 1С</text>
  <rect x="632" y="36" width="100" height="26" rx="8" fill="#FAEEDA"/>
  <text x="682" y="53" font-size="12" font-weight="500" fill="#854F0B" text-anchor="middle">1С · OData</text>

  <line x1="28" y1="86" x2="732" y2="86" stroke="#E8E6DE" stroke-width="1"/>

  <rect x="430" y="104" width="302" height="40" rx="12" fill="#F1EFE8"/>
  <text x="448" y="129" font-size="14" fill="#2C2C2A">Проверь август перед отчётностью</text>

  <circle cx="44" cy="180" r="14" fill="#FAECE7"/>
  <text x="44" y="186" font-size="17" font-weight="500" fill="#993C1D" text-anchor="middle">*</text>

  <rect x="70" y="166" width="226" height="26" rx="6" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <text x="84" y="183" font-size="12" fill="#0F6E56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">✓</text>
  <text x="98" y="183" font-size="12" fill="#5F5E5A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">check_month_close · 2026-08</text>
  <rect x="306" y="166" width="230" height="26" rx="6" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <text x="320" y="183" font-size="12" fill="#0F6E56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">✓</text>
  <text x="334" y="183" font-size="12" fill="#5F5E5A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get_account_card · счёт 26</text>

  <text x="70" y="220" font-size="15" fill="#2C2C2A">Месяц закрыт, но нашлись две проблемы:</text>

  <rect x="70" y="234" width="662" height="132" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <rect x="88" y="252" width="62" height="22" rx="6" fill="#FCEBEB"/>
  <text x="119" y="267" font-size="12" font-weight="500" fill="#A32D2D" text-anchor="middle">ошибка</text>
  <text x="164" y="268" font-size="15" fill="#2C2C2A">На счёте 26 после закрытия осталось</text>
  <text x="712" y="268" font-size="15" fill="#2C2C2A" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">184 300 ₽</text>
  <text x="164" y="290" font-size="13" fill="#888780">зарплата, аренда и услуги проведены 31.08 уже после закрытия</text>
  <line x1="70" y1="306" x2="732" y2="306" stroke="#E8E6DE" stroke-width="1"/>
  <rect x="88" y="320" width="62" height="22" rx="6" fill="#FCEBEB"/>
  <text x="119" y="335" font-size="12" font-weight="500" fill="#A32D2D" text-anchor="middle">ошибка</text>
  <text x="164" y="336" font-size="15" fill="#2C2C2A">Расчётный счёт в минусе на 31.08</text>
  <text x="712" y="336" font-size="15" fill="#2C2C2A" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">−12 400 ₽</text>
  <text x="164" y="356" font-size="13" fill="#888780">не загружена выписка за последний день</text>

  <rect x="70" y="382" width="662" height="98" rx="8" fill="#E1F5EE"/>
  <text x="88" y="408" font-size="13" font-weight="500" fill="#0F6E56">Что сделать</text>
  <text x="88" y="432" font-size="14" fill="#04342C">1. Загрузить выписку за 31.08 и провести её.</text>
  <text x="88" y="456" font-size="14" fill="#04342C">2. Перезакрыть август: «Закрытие месяца» → «Выполнить».</text>
</svg>
